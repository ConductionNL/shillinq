# gitleaks configuration: the default rules, plus allowlists for findings
# that are not secrets. Each allowlist names the exact files and only the
# rules that fire there, so anything else in those files is still reported.

[extend]
useDefault = true

[[allowlists]]
description = "Agent skill instructions: curl examples with the default admin:admin login of the local development container."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)\.claude/skills/opsx\-verify/SKILL\.md$''',
  '''(^|/)\.claude/skills/team\-qa/SKILL\.md$''',
  '''(^|/)\.claude/skills/test\-api/SKILL\.md$''',
  '''(^|/)\.claude/skills/test\-performance/SKILL\.md$''',
  '''(^|/)\.claude/skills/test\-security/SKILL\.md$''',
]

[[allowlists]]
description = "Documentation examples: the default admin:admin login of the local development and demo containers."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)docs/Installation/demo\-environment\.md$''',
]

[[allowlists]]
description = "Documentation sample: a truncated, made-up widget key (bk_live_ followed by a few characters and an ellipsis)."
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)docs/integration/widget\-partner\-onboarding\.md$''',
]

[[allowlists]]
description = "Documentation examples: the default admin:admin login of the local development container."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)docs/user\-guide/bookings/creating\-bookings\.md$''',
]

[[allowlists]]
description = "Register and seed data: the matched fields are human-readable slugs and identifiers, not credentials."
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)lib/Settings/example\-sets/zuiddrecht\.json$''',
  '''(^|/)lib/Settings/register\.d/bookkeeping\-market\-government\-separation\.json$''',
]

[[allowlists]]
description = "Specification prose: 'tokens as an OpenRegister-managed ...' matches the generic key pattern; there is no key in it."
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)openspec/changes/archive/2026\-06\-14\-bookings\-confirm\-flow/specs/bookings\-confirm\-flow/spec\.md$''',
  '''(^|/)openspec/specs/bookings\-confirm\-flow/spec\.md$''',
]

[[allowlists]]
description = "App manifest: the key fields are page and widget identifiers, not credentials."
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)src/manifest\.d/bookkeeping\-payroll\-engine\-nl\.json$''',
  '''(^|/)src/manifest\.json$''',
]

[[allowlists]]
description = "Unit test fixtures: fixed signing secrets that exist only inside the tests."
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)tests/Unit/Controller/PortalContributionDeclineControllerTest\.php$''',
  '''(^|/)tests/Unit/Controller/PortalPaymentInitiationControllerTest\.php$''',
  '''(^|/)tests/Unit/Portal/PortalAssertionVerifierRejectionReasonTest\.php$''',
  '''(^|/)tests/Unit/Portal/PortalAssertionVerifierTest\.php$''',
]
