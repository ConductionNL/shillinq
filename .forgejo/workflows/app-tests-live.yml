# app-tests-live.yml — shillinq caller for the LIVE-NC reusable workflow.
#
# Boots a real, seeded Nextcloud (db + NC + openregister deployed/enabled +
# shillinq deployed/enabled), then runs the deep Playwright e2e
# (tests/e2e/workflows/) and/or the Newman API-contract suite against it as
# HARD gates. Generalised per GAP-2 (arm CI live-gating) from openregister's
# reference rig; the reusable tests-live.yml is byte-identical fleet-wide, only
# these inputs differ. Additive — does not touch app-tests.yml / release /
# pre-merge workflows.
#
# Gate status for shillinq (see TESTING-CI-ROLLOUT.md for the evidence table):
#   deep-e2e: true  — e2e _fixtures discovers register by slug 'shillinq' from live OR (not hardcoded), run-id-prefixed; not live-verified this pass
#   newman:   false  — TODO: 4 collections present but no tests/integration/run-newman.sh runner yet

name: app-tests-live

on:
  pull_request:
    branches:
      - development
      - main
      - beta
  push:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    uses: ./.forgejo/workflows/tests-live.yml
    with:
      app-id: shillinq
      is-openregister: false
      run-e2e: true
      run-newman: false
      newman-entrypoint: tests/integration/run-newman.sh
