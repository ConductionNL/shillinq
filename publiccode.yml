description:
  en:
    shortDescription: >
      Invoicing and financial administration for Nextcloud.
    longDescription: >
      Shillinq provides invoicing and financial administration capabilities within
      Nextcloud. It supports creating and managing invoices, tracking payments,
      and administering financial records. Built on Open Register, it integrates
      with Nextcloud's collaboration ecosystem and is designed to meet Dutch
      government and SME financial administration requirements.
      Conduction maintains this component within the Nextcloud ISV programme.
      Shillinq is available in the Nextcloud App Store at
      https://apps.nextcloud.com/apps/shillinq.
    features:
      - Bookkeeping and general ledger with double-entry accounting
      - Accounts payable and receivable
      - Sales invoicing and e-invoicing (UBL/Peppol)
      - Purchase orders and procurement workflows
      - Supplier management and approval chains
      - Contract lifecycle management
      - Bank reconciliation and payment matching
      - VAT reporting and compliance
      - Financial statements, budget planning and forecasting
      - Dutch government compliance (BBV, IV3, SiSa, DigiInkoop)

  nl:
    shortDescription: >
      Facturatie en financiële administratie voor Nextcloud.
    longDescription: >
      Shillinq biedt facturatie- en financiële administratiemogelijkheden binnen
      Nextcloud. Het ondersteunt het aanmaken en beheren van facturen, het bijhouden
      van betalingen en het administreren van financiële gegevens. Gebouwd op Open
      Register integreert het met het Nextcloud-ecosysteem en is ontworpen om te
      voldoen aan de financiële administratievereisten van de Nederlandse overheid
      en het MKB.
      Conduction onderhoudt dit component binnen het Nextcloud ISV-programma.
      Shillinq is beschikbaar in de Nextcloud App Store via
      https://apps.nextcloud.com/apps/shillinq.
    features:
      - Boekhouding en grootboek met dubbel boekhouden
      - Crediteuren- en debiteurenbeheer
      - Verkoopfacturen en e-facturatie (UBL/Peppol)
      - Inkooporders en inkoopworkflows
      - Leveranciersbeheer en goedkeuringsketens
      - Contractbeheer over de hele levenscyclus
      - Bankafstemming en betalingsmatching
      - Btw-aangifte en compliance
      - Financiële overzichten, begroting en prognoses
      - Naleving van overheidseisen (BBV, IV3, SiSa, DigiInkoop)

