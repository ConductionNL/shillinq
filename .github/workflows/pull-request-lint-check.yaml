name: Lint Check

on:
  pull_request:
    branches:
      - development
      - main
      - beta

jobs:
  lint-check:
    runs-on: ubuntu-latest
    # Observed fleet-wide over 176 runs: median 0.6 min, max 1.4 min.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install dependencies
        run: npm ci

      - name: Linting
        run: npm run lint
